services:
  db:
    image: postgres:16-alpine
    container_name: trohub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trohub}
      POSTGRES_USER: ${POSTGRES_USER:-trohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trohub_dev_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - trohub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trohub} -d ${POSTGRES_DB:-trohub}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trohub_pgdata:
    driver: local

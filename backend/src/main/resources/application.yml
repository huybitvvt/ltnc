spring:
  application:
    name: trohub-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

trohub:
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  api-docs:
    version: OPENAPI_3_0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
  servlet:
    context-path: /

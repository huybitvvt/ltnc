spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trohub}
    username: ${SPRING_DATASOURCE_USERNAME:trohub}
    password: ${SPRING_DATASOURCE_PASSWORD:trohub_dev_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

trohub:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-seconds: 900
    refresh-token-expiration-days: 7
  owner-bootstrap:
    login: ${OWNER_BOOTSTRAP_LOGIN:owner}
    password: ${OWNER_BOOTSTRAP_PASSWORD:TroHubOwner@2026}

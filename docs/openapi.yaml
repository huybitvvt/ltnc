          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

# ----------------------------------------------------
# COMPONENTS & SCHEMAS
# ----------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, default: 0 }
    SizeParam:
      name: size
      in: query
      required: false
      schema: { type: integer, default: 20 }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Khóa chống trùng giao dịch tài chính do client sinh ra.

  responses:
    ErrorResponse:
      description: Lỗi nghiệp vụ hoặc hệ thống
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiMeta:
      type: object
      properties:
        traceId: { type: string }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        traceId: { type: string }

    ApiError:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Dữ liệu yêu cầu không hợp lệ"
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        traceId:
          type: string

    SuccessMessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message: { type: string }
        meta:
          $ref: '#/components/schemas/ApiMeta'

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, example: "owner" }
        password: { type: string, example: "TroHub@123" }

    ActivateInviteRequest:
      type: object
      required: [inviteCode, password]
      properties:
        inviteCode: { type: string, example: "INV-982314" }
        password: { type: string, example: "TenantSecurePass@123" }

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            tokenType: { type: string, example: "Bearer" }
            expiresIn: { type: integer, example: 900 }
            refreshToken: { type: string, nullable: true }
            user:
              $ref: '#/components/schemas/UserSummary'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        role: { type: string, enum: [OWNER, STAFF, TENANT] }
        enabled: { type: boolean }

    UserProfileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            login: { type: string }
            role: { type: string, enum: [OWNER, STAFF, TENANT] }
            fullName: { type: string, nullable: true }
            assignedBuildingIds:
              type: array
              items: { type: string, format: uuid }
        meta:
          $ref: '#/components/schemas/ApiMeta'

    CreateStaffRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
        buildingIds:
          type: array
          items: { type: string, format: uuid }

    UserDetailResponse:
      type: object
      properties:
        data:

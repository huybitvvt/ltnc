openapi: 3.0.3
info:
  title: TroHub Management API
  version: 1.0.0
  description: |
    API đặc tả chính thức của hệ thống Quản lý nhà trọ TroHub.
    Phục vụ đồng nhất cho cả React Web và React Native Mobile cho cả 3 vai trò OWNER, STAFF, TENANT.
    Tất cả trường tiền tệ dạng chuỗi (numeric string, ví dụ: "3000000").
    Tất cả các thao tác phát hành hóa đơn và tài chính yêu cầu header Idempotency-Key (UUID).
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  # ----------------------------------------------------
  # AUTHENTICATION & SESSIONS
  # ----------------------------------------------------
  /auth/login:
    post:
      summary: Đăng nhập hệ thống
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/activate:
    post:
      summary: Kích hoạt tài khoản người thuê qua mã mời
      operationId: activateAccount
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateInviteRequest'
      responses:
        '200':
          description: Kích hoạt thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /auth/csrf:
    get:
      summary: Lấy CSRF token cho Web client
      operationId: getCsrfToken
      tags: [Auth]
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  headerName: { type: string, example: "X-XSRF-TOKEN" }

  /auth/web/refresh:
    post:
      summary: Xoay vòng refresh token cho Web client (HttpOnly cookie)
      operationId: refreshWebSession
      tags: [Auth]
      responses:
        '200':
          description: Cấp mới access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/web/logout:
    post:
      summary: Đăng xuất thu hồi phiên Web
      operationId: logoutWeb
      tags: [Auth]
      responses:
        '200':
          description: Thu hồi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/mobile/refresh:
    post:
      summary: Xoay vòng refresh token cho Mobile client
      operationId: refreshMobileSession
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Cấp mới token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/mobile/logout:
    post:
      summary: Đăng xuất thu hồi phiên Mobile
      operationId: logoutMobile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Thu hồi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/me:
    get:
      summary: Thông tin tài khoản hiện tại
      operationId: getCurrentUser
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  # ----------------------------------------------------
  # USERS & STAFF ASSIGNMENTS (OWNER)
  # ----------------------------------------------------
  /users:
    get:
      summary: Danh sách người dùng (OWNER)
      operationId: listUsers
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [OWNER, STAFF, TENANT] }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
    post:
      summary: Tạo tài khoản nhân viên (OWNER)
      operationId: createStaffUser
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'

  /users/{id}/status:
    put:
      summary: Bật/khóa tài khoản người dùng
      operationId: updateUserStatus
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'

  /users/{id}/assignments:
    get:
      summary: Danh sách tòa nhà được giao của nhân viên
      operationId: getUserAssignments
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string, format: uuid }
    put:
      summary: Cập nhật phân công tòa nhà cho nhân viên (OWNER)
      operationId: updateUserAssignments
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildingIds]
              properties:
                buildingIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  # ----------------------------------------------------
  # PROPERTIES: BUILDINGS, FLOORS, ROOMS
  # ----------------------------------------------------
  /buildings:
    get:
      summary: Danh sách tòa nhà trong phạm vi quyền
      operationId: listBuildings
      tags: [Properties]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingListResponse'
    post:
      summary: Tạo mới tòa nhà (OWNER)
      operationId: createBuilding
      tags: [Properties]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingDetailResponse'

  /buildings/{id}:
    get:
      summary: Chi tiết tòa nhà
      operationId: getBuilding
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingDetailResponse'
    put:
      summary: Cập nhật tòa nhà
      operationId: updateBuilding
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingDetailResponse'

  /buildings/{id}/floors:
    get:
      summary: Danh sách tầng của tòa nhà
      operationId: listBuildingFloors
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorListResponse'
    post:
      summary: Tạo tầng mới trong tòa nhà (OWNER)
      operationId: createFloor
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFloorRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorDetailResponse'

  /rooms:
    get:
      summary: Danh sách phòng trọ có bộ lọc và phân trang
      operationId: listRooms
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: buildingId
          in: query
          schema: { type: string, format: uuid }
        - name: floorId
          in: query
          schema: { type: string, format: uuid }
        - name: bookable
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPageResponse'
    post:
      summary: Tạo mới phòng trọ
      operationId: createRoom
      tags: [Properties]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetailResponse'

  /rooms/{id}:
    get:
      summary: Chi tiết phòng trọ
      operationId: getRoom
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetailResponse'
    put:
      summary: Cập nhật phòng trọ
      operationId: updateRoom
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetailResponse'

  /rooms/{id}/rentability:
    put:
      summary: Cập nhật trạng thái sẵn sàng cho thuê (bookable)
      operationId: updateRoomRentability
      tags: [Properties]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookable]
              properties:
                bookable: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetailResponse'

  # ----------------------------------------------------
  # RESIDENTS & CONTRACTS
  # ----------------------------------------------------
  /tenants:
    get:
      summary: Danh sách hồ sơ người thuê
      operationId: listTenants
      tags: [Tenancy]
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPageResponse'
    post:
      summary: Tạo hồ sơ người thuê mới
      operationId: createTenant
      tags: [Tenancy]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDetailResponse'

  /tenants/{id}/invite:
    post:
      summary: Tạo mã mời kích hoạt tài khoản cho người đại diện
      operationId: issueTenantInvite
      tags: [Tenancy]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      inviteCode: { type: string, example: "INV-982314" }
                      expiresAt: { type: string, format: date-time }

  /contracts:
    get:
      summary: Danh sách hợp đồng thuê
      operationId: listContracts
      tags: [Contracts]
      security:
        - BearerAuth: []
      parameters:
        - name: buildingId
          in: query
          schema: { type: string, format: uuid }
        - name: roomId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, ACTIVE, ENDED] }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPageResponse'
    post:
      summary: Tạo hợp đồng mới (trạng thái DRAFT)
      operationId: createContractDraft
      tags: [Contracts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetailResponse'

  /contracts/{id}:
    get:
      summary: Chi tiết hợp đồng
      operationId: getContract
      tags: [Contracts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetailResponse'

  /contracts/{id}/activate:
    post:
      summary: Kích hoạt hợp đồng và nhận phòng (chuyển sang ACTIVE kèm chỉ số bàn giao)
      operationId: activateContract
      tags: [Contracts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateContractRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetailResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /contracts/{id}/extend:
    post:
      summary: Gia hạn thời hạn dự kiến kết thúc của hợp đồng
      operationId: extendContract
      tags: [Contracts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPlannedEndExclusive, reason]
              properties:
                newPlannedEndExclusive: { type: string, format: date }
                reason: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetailResponse'

  /contracts/{id}/checkout:
    post:
      summary: Trả phòng thực tế và giải phóng phòng (chuyển sang ENDED)
      operationId: checkoutContract
      tags: [Contracts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutContractRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetailResponse'

  /contracts/{id}/members:
    get:
      summary: Danh sách thành viên cùng phòng
      operationId: listContractMembers
      tags: [Contracts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractMemberListResponse'
    post:
      summary: Thêm thành viên vào hợp đồng
      operationId: addContractMember
      tags: [Contracts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractMemberResponse'

  # ----------------------------------------------------
  # TARIFFS, METERS & READINGS
  # ----------------------------------------------------
  /services:
    get:
      summary: Danh mục các loại phí và dịch vụ
      operationId: listServices
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
    post:
      summary: Tạo mới loại dịch vụ
      operationId: createService
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailResponse'

  /buildings/{id}/tariffs:
    get:
      summary: Bảng đơn giá theo tòa nhà
      operationId: getBuildingTariffs
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffListResponse'
    post:
      summary: Thiết lập đơn giá mới có tháng hiệu lực
      operationId: setTariff
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTariffRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffDetailResponse'

  /rooms/{id}/meters:
    get:
      summary: Danh sách đồng hồ đo của phòng
      operationId: getRoomMeters
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMeterListResponse'

  /meters/{id}/readings:
    get:
      summary: Lịch sử ghi chỉ số của đồng hồ
      operationId: getMeterReadings
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReadingListResponse'
    post:
      summary: Ghi chỉ số mới (bàn giao / cuối kỳ / trả phòng)
      operationId: recordMeterReading
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMeterReadingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReadingResponse'

  /contracts/{id}/consumption-alerts:
    get:
      summary: Danh sách cảnh báo tiêu thụ bất thường của hợp đồng
      operationId: getContractConsumptionAlerts
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          schema: { type: string, example: "2026-09" }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'

  /consumption-alerts/{id}/acknowledge:
    post:
      summary: Quản lý xác nhận số liệu chỉ số đúng kèm lý do
      operationId: acknowledgeConsumptionAlert
      tags: [Metering & Pricing]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

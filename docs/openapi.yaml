components:
  schemas:
    UpdateUserStatusRequest:
      type: object
      properties:
        enabled:
          type: boolean
    ApiResponseUserSummaryDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/UserSummaryDto"
        meta:
          type: object
          additionalProperties:
            type: object
        success:
          type: boolean
    UserSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - STAFF
          - TENANT
        enabled:
          type: boolean
    UpdateAssignmentsRequest:
      type: object
      properties:
        buildingIds:
          type: array
          items:
            type: string
            format: uuid
    ApiResponseMapStringString:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            type: string
        meta:
          type: object
          additionalProperties:
            type: object
        success:
          type: boolean
    RoomRequest:
      required:
      - basePrice
      - depositAmount
      - roomNumber
      type: object
      properties:
        floorId:
          type: string
          format: uuid
        roomNumber:
          minLength: 1
          type: string
        basePrice:
          pattern: "^-?[0-9]{1,19}$"
          type: string
          example: "3000000"
        depositAmount:
          pattern: "^-?[0-9]{1,19}$"
          type: string
          example: "3000000"
        area:
          minimum: 0
          exclusiveMinimum: false
          type: number
        maxTenants:
          minimum: 1
          type: integer
          format: int32
        bookable:
          type: boolean
    ApiResponseRoomResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/RoomResponse"
        meta:
          type: object
          additionalProperties:
            type: object
        success:
          type: boolean
    RoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        buildingName:
          type: string
        floorId:
          type: string
          format: uuid
        floorName:
          type: string
        roomNumber:
          type: string
        basePrice:
          pattern: "^-?[0-9]{1,19}$"
          type: string
          example: "3000000"
        depositAmount:
          pattern: "^-?[0-9]{1,19}$"
          type: string
          example: "3000000"
        area:
          type: number
        maxTenants:
          type: integer
          format: int32
        bookable:
          type: boolean
        status:
          type: string
          enum:
          - VACANT
          - RENTED
          - DEPOSIT_RESERVED
          - MAINTENANCE
        createdAt:
          type: string
          format: date-time
    ApiResponseNotificationDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/NotificationDto"
        meta:
          type: object
          additionalProperties:
            type: object
        success:
          type: boolean
    NotificationDto:
      type: object
      properties:
        id:

services:
  - type: web
    name: trohub-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_BOOTSTRAP_ENABLED
        value: "true"
      - key: OWNER_BOOTSTRAP_LOGIN
        value: "owner"
      - key: OWNER_BOOTSTRAP_PASSWORD
        sync: false
      - key: TROHUB_CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
